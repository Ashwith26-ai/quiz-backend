# =======================================================
# Online Quiz Management System - Application Configuration
# =======================================================

spring.application.name=online-quiz-management-system
server.port=8080

# MySQL Database Configuration
# Override via environment variables DB_URL, DB_USERNAME, DB_PASSWORD if needed
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_quiz_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Session Management
server.servlet.session.timeout=60m

# File Upload / Multipart limits (if needed)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
